[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options_scanner"
version = "1.0.0"
description = "Personal options-flow research system: flow monitoring, open-interest analysis, earnings intelligence"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "google-api-python-client",
    "google-auth",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pandas",
    "praw",
    "psutil",
    "PyAutoGUI",
    "pytz",
    "requests",
    "textual",
    "tweepy",
    "yfinance",
]

[tool.setuptools.packages.find]
include = ["core*", "tools*", "strategies*"]
