[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options_scanner"
version = "1.0.0"
dependencies = [
    "flask",
    "flask-cors",
    "anthropic"
]

[tool.setuptools.packages.find]
include = ["core*", "tools*", "strategies*", "daily_analysis*"]